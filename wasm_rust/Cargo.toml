[package]
name = "wasmusicorelectron"
version = "0.1.0"
authors = [ "github.com/slamkun" ]
edition = "2018"

[lib]
crate-type = [ "cdylib" ]

[dependencies]
wasm-bindgen = "0.2.47"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
js-sys = "0.3.24"
console_error_panic_hook = "0.1.6"

# Local crates
midi-file = { path = "src/midi-file" }
midly = "0.5"

[dependencies.web-sys]
version = "0.3.24"
features = [
  'Document',
  'Element',
  'HtmlElement',
  'Node',
  'Window',
  'console',
]
