[package]
name = "wasmusicorelectron"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
js-sys = "0.3"
console_error_panic_hook = "0.1"
midi-file = { path = "../src/submodules/Neothesia/midi-file" }
midly = "0.5"

[dependencies.web-sys]
version = "0.3"
features = ['console']
